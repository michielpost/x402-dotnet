name: Push NuGet packages

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # enable GitHub OIDC token issuance for NuGet trusted publishing

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build with dotnet
      run: dotnet build src --configuration Release

    - name: Run tests
      run: dotnet test src --configuration Release

    # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid 1 hour)
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: mailpost

    - name: Publish x402.Core
      run: dotnet nuget push src/x402.Core/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish x402
      run: dotnet nuget push src/x402/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish x402.Client
      run: dotnet nuget push src/x402.Client/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish x402.Coinbase
      run: dotnet nuget push src/x402.Coinbase/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish x402.Client.EVM
      run: dotnet nuget push src/x402.Client.EVM/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish x402.Client.Casper
      run: dotnet nuget push src/x402.Client.Casper/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
